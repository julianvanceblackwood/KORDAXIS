name: KORDAXIS Python Core

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "migrations/**"
      - "pyproject.toml"
      - ".github/workflows/python-core.yml"

  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "migrations/**"
      - "pyproject.toml"
      - ".github/workflows/python-core.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    name: unit-tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show interpreter version
        run: python --version

      - name: Run domain unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests/unit -p 'test_*.py' -v

  postgres-integration:
    name: postgres-integration (Python 3.13 / PostgreSQL 18.6)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kordaxis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kordaxis_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      KORDAXIS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kordaxis_test
      PGPASSWORD: postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"

      - name: Show interpreter version
        run: python --version

      - name: Install KORDAXIS
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Verify PostgreSQL availability
        run: |
          pg_isready \
            -h localhost \
            -p 5432 \
            -U postgres \
            -d kordaxis_test

      - name: Apply raw-evidence migration
        run: |
          psql \
            "$KORDAXIS_TEST_DATABASE_URL" \
            -v ON_ERROR_STOP=1 \
            -f migrations/0001_raw_evidence_store.sql

      - name: Run PostgreSQL integration tests
        env:
          PYTHONPATH: src
        run: |
          python -m unittest \
            tests.integration.test_postgres_evidence_store \
            -v